name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # No module yet, so there is nothing to hash for the module cache.
          cache: false

      - name: Install SIPp
        run: |
          sudo apt-get update
          sudo apt-get install -y sip-tester libcap2-bin
          sudo setcap cap_net_raw+ep "$(command -v sipp)"

      - name: Test
        shell: bash
        run: |
          if [ -f go.mod ]; then
            go test ./...
          else
            echo "there is no module yet"
          fi
